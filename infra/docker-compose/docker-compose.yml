services:
  api-gateway:
    build:
      context: ../../apps/api-gateway
    container_name: wealthops-api-gateway
    environment:
      DATABASE_URL: postgresql://wealthops:wealthops@postgres:5432/wealthops
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      OBJECT_STORAGE_URL: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: minioadmin
      OBJECT_STORAGE_SECRET_KEY: minioadmin
      OBJECT_STORAGE_BUCKET: wealthops-documents
      QDRANT_COLLECTION_NAME: document_chunks
      EMBEDDING_PROVIDER: mock
      EMBEDDING_DIMENSIONS: 384
      DOCUMENT_MAX_FILE_SIZE_BYTES: 10485760
      DOCUMENT_CHUNK_SIZE: 1200
      DOCUMENT_CHUNK_OVERLAP: 200
      JWT_SECRET: local-development-jwt-secret-change-me
      LLM_PROVIDER: mock
      LLM_API_KEY: local-development-placeholder
      LLM_MODEL: mock-rag-local
      APP_ENV: local
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: wealthops-postgres
    environment:
      POSTGRES_DB: wealthops
      POSTGRES_USER: wealthops
      POSTGRES_PASSWORD: wealthops
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealthops -d wealthops"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wealthops-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.6
    container_name: wealthops-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: wealthops-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  minio-data:
